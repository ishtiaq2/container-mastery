<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker><marker id="arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker></defs><rect width="800" height="400" fill="#ffffff"/><text x="24" y="34" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">VirtualBox adds an application layer; KVM makes the kernel the hypervisor</text><path d="M400 56V372" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/><text x="204.0" y="72" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">VirtualBox (Type 2)</text><text x="596.0" y="72" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">KVM (Type 1)</text><rect x="24" y="88" width="360" height="48" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.25"/><text x="204.0" y="116.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">Guest VMs: Ubuntu, CentOS</text><rect x="24" y="152" width="360" height="60" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/><text x="204.0" y="177.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">VirtualBox application</text><text x="204.0" y="195.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">user-space program: GUI, VBoxManage</text><rect x="24" y="228" width="360" height="60" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.25"/><text x="204.0" y="253.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">Host OS: Windows, macOS or Linux</text><text x="204.0" y="271.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">+ vboxdrv kernel driver</text><rect x="24" y="304" width="360" height="48" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.25"/><text x="204.0" y="332.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">Hardware: CPU with VT-x / AMD-V</text><rect x="416" y="88" width="360" height="48" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.25"/><text x="596.0" y="116.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">Guest VMs: Ubuntu, CentOS</text><rect x="416" y="152" width="360" height="60" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.25"/><text x="596.0" y="177.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">QEMU process per VM</text><text x="596.0" y="195.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">managed by libvirt (virsh)</text><rect x="416" y="228" width="360" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="596.0" y="253.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">Linux kernel + KVM module</text><text x="596.0" y="271.0" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle">the kernel itself is the hypervisor</text><rect x="416" y="304" width="360" height="48" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.25"/><text x="596.0" y="332.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">Hardware: CPU with VT-x / AMD-V</text><text x="204.0" y="376" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">Extra layer between guest and hardware</text><text x="596.0" y="376" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">Guest code goes straight to the CPU</text></svg>
