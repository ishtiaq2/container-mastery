<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" font-family="Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker><marker id="arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker></defs><rect width="800" height="520" fill="#ffffff"/><text x="24" y="34" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">Only a VM brings its own kernel; processes and containers share the host&#x27;s</text><text x="136.0" y="72" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Normal process</text><text x="400.0" y="72" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Container (Docker)</text><text x="664.0" y="72" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">KVM virtual machine</text><rect x="24" y="88" width="224" height="48" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.25"/><text x="136.0" y="116.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">Your app (python app.py)</text><rect x="24" y="352" width="224" height="56" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/><text x="136.0" y="375.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">Host kernel</text><text x="136.0" y="393.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">shared by everything</text><path d="M136 136V352" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/><text x="144" y="248" font-size="12" font-weight="400" fill="#475569" text-anchor="start">system calls go</text><text x="144" y="266" font-size="12" font-weight="400" fill="#475569" text-anchor="start">straight to the host</text><rect x="288" y="88" width="224" height="48" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.25"/><text x="400.0" y="116.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">Your app</text><rect x="288" y="152" width="224" height="72" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/><text x="400.0" y="174.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">Namespaces + cgroups</text><text x="400.0" y="192.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">own view of files, PIDs,</text><text x="400.0" y="211.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">network; CPU/RAM limits</text><rect x="288" y="352" width="224" height="56" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/><text x="400.0" y="375.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">Host kernel</text><text x="400.0" y="393.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">still shared</text><path d="M400 224V352" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/><rect x="552" y="88" width="224" height="48" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.25"/><text x="664.0" y="116.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">Your app</text><rect x="552" y="152" width="224" height="56" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="664.0" y="175.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">Guest kernel</text><text x="664.0" y="193.0" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle">its own Linux kernel</text><rect x="552" y="224" width="224" height="72" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="664.0" y="246.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">Virtual hardware</text><text x="664.0" y="264.0" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle">vCPUs, RAM, virtio disk</text><text x="664.0" y="283.0" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle">and NIC (from QEMU)</text><rect x="552" y="312" width="224" height="32" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="664.0" y="332.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">Hardware boundary (VT-x, EPT)</text><rect x="552" y="352" width="224" height="56" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.25"/><text x="664.0" y="375.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">Host kernel + KVM</text><text x="664.0" y="393.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">sees one QEMU process</text><rect x="24" y="424" width="224" height="40" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.25"/><text x="136.0" y="448.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">Hardware</text><rect x="288" y="424" width="224" height="40" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.25"/><text x="400.0" y="448.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">Hardware</text><rect x="552" y="424" width="224" height="40" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.25"/><text x="664.0" y="448.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">Hardware</text><circle cx="38" cy="484" r="5" fill="#dc2626"/><text x="50" y="488" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start">Own kernel: no</text><circle cx="302" cy="484" r="5" fill="#dc2626"/><text x="314" y="488" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start">Own kernel: no</text><circle cx="566" cy="484" r="5" fill="#16a34a"/><text x="578" y="488" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start">Own kernel: yes</text><circle cx="38" cy="504" r="5" fill="#d97706"/><text x="50" y="508" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start">Boundary enforced by: user permissions</text><circle cx="302" cy="504" r="5" fill="#d97706"/><text x="314" y="508" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start">Boundary enforced by: kernel namespaces</text><circle cx="566" cy="504" r="5" fill="#16a34a"/><text x="578" y="508" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start">Boundary enforced by: the CPU itself</text></svg>
