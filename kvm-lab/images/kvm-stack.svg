<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="800" height="540" font-family="Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker><marker id="arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker></defs><rect width="800" height="540" fill="#ffffff"/><text x="24" y="34" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">Each VM is a QEMU process; KVM runs its code on the real CPU</text><rect x="24" y="56" width="752" height="44" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.25"/><text x="400.0" y="82.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">You: virsh, virt-install, virt-manager, kvm-lab.sh</text><path d="M400 100V124" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="124" width="752" height="60" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.25"/><text x="400.0" y="149.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">libvirt daemon</text><text x="400.0" y="167.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">manages VMs (domains), networks (lab-nat) and storage (lab-pool)</text><path d="M144 184V216" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="216" width="240" height="80" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.25"/><text x="144.0" y="242.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">VM lab-web1</text><text x="144.0" y="260.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">qemu-system-x86_64 process</text><text x="144.0" y="279.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">Ubuntu 24.04 guest</text><path d="M144 296V328" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M400 184V216" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="280" y="216" width="240" height="80" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.25"/><text x="400.0" y="242.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">VM lab-db1</text><text x="400.0" y="260.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">qemu-system-x86_64 process</text><text x="400.0" y="279.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">CentOS Stream 9 guest</text><path d="M400 296V328" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M656 184V216" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="536" y="216" width="240" height="80" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.25"/><text x="656.0" y="242.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">VM lab-stack</text><text x="656.0" y="260.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">qemu-system-x86_64 process</text><text x="656.0" y="279.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">Ubuntu + Docker</text><path d="M656 296V328" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/><text x="410" y="206" font-size="12" font-weight="400" fill="#475569" text-anchor="start">starts and configures</text><text x="410" y="318" font-size="12" font-weight="400" fill="#475569" text-anchor="start">guest code runs on the CPU through KVM</text><rect x="24" y="328" width="752" height="116" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/><text x="40" y="352" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="start">Linux host kernel</text><rect x="40" y="364" width="352" height="64" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="216.0" y="391.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">KVM module (kvm_intel / kvm_amd)</text><text x="216.0" y="409.0" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle">/dev/kvm: guest code runs directly on the CPU</text><rect x="408" y="364" width="352" height="64" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.25"/><text x="584.0" y="391.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">Scheduler, memory manager, drivers</text><text x="584.0" y="409.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">each VM is scheduled like any other process</text><path d="M400 444V468" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="468" width="752" height="48" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.25"/><text x="400.0" y="496.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">Hardware: CPU with VT-x / AMD-V, RAM, disks, network card</text></svg>
