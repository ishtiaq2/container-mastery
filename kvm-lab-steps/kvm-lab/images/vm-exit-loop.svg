<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" font-family="Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker><marker id="arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker></defs><rect width="800" height="360" fill="#ffffff"/><text x="24" y="34" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">The CPU traps the guest whenever it touches something it does not own</text><rect x="24" y="70" width="220" height="72" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.25"/><text x="134.0" y="101.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">1. vCPU thread</text><text x="134.0" y="119.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">QEMU calls ioctl(KVM_RUN)</text><rect x="290" y="70" width="220" height="72" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="400.0" y="92.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">2. Guest mode</text><text x="400.0" y="110.0" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle">guest code runs at full</text><text x="400.0" y="129.0" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle">native speed on the core</text><rect x="556" y="70" width="220" height="72" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/><text x="666.0" y="92.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">3. VM exit</text><text x="666.0" y="110.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">guest touches I/O, a</text><text x="666.0" y="129.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">privileged register, etc.</text><rect x="556" y="220" width="220" height="72" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.25"/><text x="666.0" y="242.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">4a. KVM handles it</text><text x="666.0" y="260.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">fast path inside the</text><text x="666.0" y="279.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">kernel (timers, MSRs)</text><rect x="290" y="220" width="220" height="72" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.25"/><text x="400.0" y="242.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">4b. QEMU emulates it</text><text x="400.0" y="260.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">device work in user space</text><text x="400.0" y="279.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">(disk, NIC, console)</text><path d="M244 106H290" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M510 106H556" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M666 142V220" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M556 256H510" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M290 256H134" fill="none" stroke="#94a3b8" stroke-width="1.5"/><path d="M134 256V142" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M700 292V316H134V256" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/><text x="150" y="330" font-size="12" font-weight="400" fill="#475569" text-anchor="start">back to step 1 (fast path skips QEMU)</text><text x="154" y="248" font-size="12" font-weight="400" fill="#475569" text-anchor="start">resume</text></svg>
