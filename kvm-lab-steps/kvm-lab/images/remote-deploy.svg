<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker><marker id="arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker></defs><rect width="800" height="400" fill="#ffffff"/><text x="24" y="34" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">Each VM on the remote bridge gets its address from the remote DHCP</text><rect x="24" y="56" width="232" height="210" rx="8" fill="none" stroke="#94a3b8" stroke-width="1.25"/><text x="40" y="82" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="start">Your laptop</text><rect x="40" y="100" width="200" height="60" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.25"/><text x="140.0" y="125.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">lab-web1.qcow2</text><text x="140.0" y="143.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">flattened, standalone</text><rect x="40" y="184" width="200" height="60" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.25"/><text x="140.0" y="209.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">virsh, virt-manager</text><text x="140.0" y="227.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">manage the remote</text><rect x="352" y="56" width="424" height="210" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/><text x="368" y="82" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="start">Remote KVM host</text><rect x="368" y="100" width="192" height="60" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.25"/><text x="464.0" y="125.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">lab-web1</text><text x="464.0" y="143.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">shipped, same MAC</text><rect x="568" y="100" width="192" height="60" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.25"/><text x="664.0" y="125.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">lab-remote1</text><text x="664.0" y="143.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">built on the remote</text><rect x="368" y="188" width="392" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="564.0" y="213.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">br-lab bridge (netplan)</text><text x="564.0" y="231.0" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle">server network card is a port of the bridge</text><rect x="352" y="312" width="424" height="60" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.25"/><text x="564.0" y="337.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">Remote network: router + DHCP server</text><text x="564.0" y="355.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">hands out a 192.168.10.x address to every VM</text><path d="M240 130H368" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/><text x="304" y="122" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">scp the disk</text><path d="M240 214H352" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="296" y="234" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">qemu+ssh</text><path d="M464 160V188" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M664 160V188" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M564 248V312" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/><text x="574" y="290" font-size="12" font-weight="400" fill="#475569" text-anchor="start">DHCP</text></svg>
