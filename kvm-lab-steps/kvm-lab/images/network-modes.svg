<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" width="800" height="410" font-family="Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker><marker id="arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker></defs><rect width="800" height="410" fill="#ffffff"/><text x="24" y="34" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">NAT hides the VM; bridge and macvtap put it on your LAN</text><rect x="24" y="52" width="240" height="330" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="144" y="80" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">NAT (default)</text><rect x="40" y="96" width="208" height="44" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.25"/><text x="144.0" y="122.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">Office LAN and router</text><path d="M144 140V166" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/><text x="152" y="158" font-size="12" font-weight="400" fill="#475569" text-anchor="start">outbound only</text><rect x="40" y="166" width="208" height="60" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.25"/><text x="144.0" y="191.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">Host: virbr-lab</text><text x="144.0" y="209.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">192.168.150.1, DHCP, NAT</text><path d="M144 226V252" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="40" y="252" width="208" height="60" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.25"/><text x="144.0" y="277.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">VM: 192.168.150.x</text><text x="144.0" y="295.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">private address</text><circle cx="54" cy="336" r="5" fill="#16a34a"/><text x="66" y="340" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start">Host to VM: yes</text><circle cx="54" cy="358" r="5" fill="#dc2626"/><text x="66" y="362" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start">LAN to VM: no</text><rect x="280" y="52" width="240" height="330" rx="8" fill="none" stroke="#94a3b8" stroke-width="1.25"/><text x="400" y="80" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Bridge</text><rect x="296" y="96" width="208" height="44" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.25"/><text x="400.0" y="122.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">Office LAN and router</text><path d="M400 140V166" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/><text x="408" y="158" font-size="12" font-weight="400" fill="#475569" text-anchor="start">same LAN</text><rect x="296" y="166" width="208" height="60" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.25"/><text x="400.0" y="191.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">Host: br-lab bridge</text><text x="400.0" y="209.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">wired NIC is a bridge port</text><path d="M400 226V252" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="296" y="252" width="208" height="60" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.25"/><text x="400.0" y="277.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">VM: LAN address</text><text x="400.0" y="295.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">from your router&#x27;s DHCP</text><circle cx="310" cy="336" r="5" fill="#16a34a"/><text x="322" y="340" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start">Host to VM: yes</text><circle cx="310" cy="358" r="5" fill="#16a34a"/><text x="322" y="362" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start">LAN to VM: yes</text><rect x="536" y="52" width="240" height="330" rx="8" fill="none" stroke="#94a3b8" stroke-width="1.25"/><text x="656" y="80" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">macvtap</text><rect x="552" y="96" width="208" height="44" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.25"/><text x="656.0" y="122.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">Office LAN and router</text><path d="M656 140V166" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/><text x="664" y="158" font-size="12" font-weight="400" fill="#475569" text-anchor="start">same LAN</text><rect x="552" y="166" width="208" height="60" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.25"/><text x="656.0" y="191.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">Host NIC + macvtap</text><text x="656.0" y="209.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">host networking unchanged</text><path d="M656 226V252" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="552" y="252" width="208" height="60" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.25"/><text x="656.0" y="277.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">VM: LAN address</text><text x="656.0" y="295.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">from your router&#x27;s DHCP</text><circle cx="566" cy="336" r="5" fill="#dc2626"/><text x="578" y="340" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start">Host to VM: no</text><circle cx="566" cy="358" r="5" fill="#16a34a"/><text x="578" y="362" font-size="13" font-weight="400" fill="#0f172a" text-anchor="start">LAN to VM: yes</text></svg>
