<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" font-family="Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker><marker id="arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker></defs><rect width="800" height="470" fill="#ffffff"/><text x="24" y="34" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">Every virtual device in the VM is backed by an ordinary host resource</text><rect x="24" y="56" width="300" height="384" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="40" y="82" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="start">Inside VM lab-web1 (what the guest sees)</text><rect x="476" y="56" width="300" height="384" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/><text x="492" y="82" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="start">On the host (what really exists)</text><rect x="40" y="100" width="268" height="64" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.25"/><text x="174.0" y="127.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">2 vCPUs</text><text x="174.0" y="145.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">CPU 0, CPU 1 in /proc/cpuinfo</text><rect x="492" y="100" width="268" height="64" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.25"/><text x="626.0" y="127.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">2 threads in the QEMU process</text><text x="626.0" y="145.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">&#x27;CPU 0/KVM&#x27;, scheduled on real cores</text><path d="M308 132H492" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="40" y="182" width="268" height="64" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.25"/><text x="174.0" y="209.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">2 GB of RAM</text><text x="174.0" y="227.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">guest physical addresses</text><rect x="492" y="182" width="268" height="64" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.25"/><text x="626.0" y="209.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">2 GB of the QEMU process memory</text><text x="626.0" y="227.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">mapped by EPT / NPT page tables</text><path d="M308 214H492" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="40" y="264" width="268" height="64" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.25"/><text x="174.0" y="291.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">Disk /dev/vda</text><text x="174.0" y="309.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">virtio block device</text><rect x="492" y="264" width="268" height="64" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.25"/><text x="626.0" y="291.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">File lab-web1.qcow2</text><text x="626.0" y="309.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">in /var/lib/libvirt/images/kvm-lab</text><path d="M308 296H492" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="40" y="346" width="268" height="64" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.25"/><text x="174.0" y="373.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">NIC enp1s0</text><text x="174.0" y="391.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">virtio network card</text><rect x="492" y="346" width="268" height="64" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.25"/><text x="626.0" y="373.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">tap device vnet0</text><text x="626.0" y="391.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">plugged into bridge virbr-lab</text><path d="M308 378H492" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/><text x="400" y="92" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">backed by</text><text x="400" y="460" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">The guest cannot address anything that is not on the left; limits are set when you create the VM.</text></svg>
